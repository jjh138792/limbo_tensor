name: Build Limbo Tensor APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Build APK with Global Gradle
        run: |
          # 彻底抛弃对 gradlew 的幻想！全图雷达直接搜索安卓工程的命脉：build.gradle
          PROJECT_DIR=$(dirname $(find . -name "build.gradle" | head -n 1))
          echo "雷达锁定安卓工程根目录: $PROJECT_DIR"
          
          # 直接切入真实的工程目录，防止你上传时带了外层文件夹导致路径错位
          cd "$PROJECT_DIR"
          
          # 无视原作者的配置，强行拉起 GitHub 服务器自带的全局 Gradle 引擎点火编译！
          gradle assembleDebug

      - name: Auto-Capture APK
        uses: actions/upload-artifact@v4
        with:
          name: Limbo-JJH-Edition
          # 全图抓取战利品，不管 APK 被编译到了哪个深层目录，直接提取出来！
          path: '**/*.apk'
          
