name: Build Limbo Tensor APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Inject Golden Gradle Engine (7.4.2)
        uses: gradle/actions/setup-gradle@v3
        with:
          # 强行抛弃系统的 9.5.1，下载并注入最适合老安卓工程的 7.4.2 版本！!！
          gradle-version: '7.4.2'

      - name: Smart Build APK
        run: |
          # 雷达扫描定位真实根目录
          PROJECT_DIR=$(dirname $(find . -name "build.gradle" | head -n 1))
          echo "雷达锁定安卓工程根目录: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # 此时的 gradle 命令已经被偷梁换柱，变成了我们刚才注入的 7.4.2！
          gradle assembleDebug

      - name: Auto-Capture APK
        uses: actions/upload-artifact@v4
        with:
          name: Limbo-JJH-Edition
          path: '**/*.apk'
          
